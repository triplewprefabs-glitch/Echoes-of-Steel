 const stride=(walking||running)?Math.sin(walkT*(running?11.2:7.4)):Math.sin(walkT*1.6)*.035;

 let jumpY=0;if(jumpActive){jumpT+=dt;const duration=.95;const u=Math.min(jumpT/duration,1);jumpY=Math.sin(Math.PI*u)*1.25;if(u>=1){jumpActive=false;jumpT=0;}}
