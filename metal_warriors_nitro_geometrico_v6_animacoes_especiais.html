 plate(shoulder,side<0?[[-.25,.15],[-.6,.28],[-.7,.08],[-.55,-.2]]:[[.25,.15],[.6,.28],[.7,.08],[.55,-.2]],.08,edge,[0,0,.34]);

 const hand=new THREE.Group();hand.position.set(0,-.65,.02);fore.add(hand);sphere(hand,[0,0,0],[.2,.18,.17],black);for(let f=-1;f<=1;f++){const finger=box(hand,[f*.105,-.18,.03],[.075,.25,.09],silver);finger.rotation.z=f*.16;}

}

 const thigh=new THREE.Group();hip.add(thigh);cyl(thigh,[0,-.42,0],.23,.2,.72,black);plate(thigh,[[-.3,-.08],[-.34,-.52],[-.18,-.86],[.18,-.86],[.34,-.52],[.3,-.08],[0,.12]],.48,blue2,[0,0,-.25]);plate(thigh,[[-.2,-.18],[0,-.32],[.2,-.18],[.12,-.58],[-.12,-.58]],.06,edge,[0,0,.25]);

 const shin=new THREE.Group();shin.position.set(0,-.12,0);knee.add(shin);cyl(shin,[0,-.42,0],.18,.2,.68,black);plate(shin,[[-.28,-.02],[-.31,-.52],[-.16,-.82],[.16,-.82],[.31,-.52],[.28,-.02],[0,.12]],.48,blue,[0,0,-.24]);plate(shin,[[-.15,-.12],[0,-.26],[.15,-.12],[.12,-.62],[-.12,-.62]],.06,black,[0,0,.25]);

}
// Back thruster pods, pipes, vents

// Right-side shoulder cannon, clearly distinct from arm silhouette
const cannon=new THREE.Group();cannon.position.set(-1.12,4.0,.15);mech.add(cannon);cyl(cannon,[0,0,0],.18,.22,.95,black,'x');cyl(cannon,[-.52,0,0],.14,.14,.25,silver,'x');cyl(cannon,[-.7,0,0],.11,.11,.12,glow,'x');box(cannon,[.12,.18,0],[.48,.18,.32],blueDark);for(let i=0;i<3;i++)box(cannon,[.15,.22-i*.07,.18],[.3,.025,.02],silver);
// Ground, platform, industrial background
const floor=mesh(new THREE.PlaneGeometry(100,100),mat(0x3d4b57,.2,.85),[0,-.04,0]);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;
const platform=mesh(new THREE.BoxGeometry(11,.16,3),mat(0x263442,.65,.48),[0,-.12,0]);platform.receiveShadow=true;
for(let x=-5;x<=5;x+=1){box(scene,[x,-.025,1.52],[.045,.025,.16],silver)}
const grid=new THREE.GridHelper(80,50,0x66819a,0x506273);grid.position.y=-.02;scene.add(grid);

let walking=false,running=false,firing=false,jetting=false,jumpActive=false,jumpT=0,clock=new THREE.Clock(),walkT=0,shotT=0,recoil=0,hitT=0,combatMode=false,landT=0,wasJumping=false,transformT=0,transforming=false,fallen=false,victory=false;const shots=[];
const originalCamera=camera.position.clone();

const orbitOffset=camera.position.clone().sub(orbitTarget);
const orbitSpherical=new THREE.Spherical().setFromVector3(orbitOffset);
let orbitTheta=orbitSpherical.theta, orbitPhi=orbitSpherical.phi, orbitRadius=orbitSpherical.radius;
function portraitLayout(){return innerHeight>innerWidth;}
function frameForScreen(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();orbitRadius=portraitLayout()?22.5:13.8;if(!cameraUserMoved){orbitPhi=portraitLayout()?1.48:Math.acos(2.3/17.8);orbitTheta=Math.atan2(5.8,19.5);}updateOrbit();}

function cameraPreset(name){

}
function pointerDistance(){

function triggerHit(){if(fallen)return;hitT=.48;mech.position.x=.12;torso.rotation.z=.16;arms.forEach(a=>a.upper.rotation.z=-.25*a.side);}

function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);walkT+=dt;shotT+=dt;recoil=Math.max(0,recoil-dt*1.8);
 const gaitRate=running?9.2:5.8;
 const phase=walkT*gaitRate;

 const stride=moving?Math.sin(phase):0;
 const gaitBlend=moving?1:0;
 legs.forEach(l=>{
  const a=stride*l.side;
  const swing=Math.sin(phase)*l.side;
  const lift=Math.max(0,Math.cos(phase)*l.side);
  const kneeBend=moving?Math.max(0,Math.cos(phase)*l.side)*(running?-.9:-.62):0;
  l.thigh.rotation.z=THREE.MathUtils.damp(l.thigh.rotation.z,swing*(running?.48:.34),9,dt);
  l.shin.rotation.z=THREE.MathUtils.damp(l.shin.rotation.z,kneeBend,12,dt);
  l.foot.rotation.z=THREE.MathUtils.damp(l.foot.rotation.z,moving?(-kneeBend*.28-swing*.10):0,13,dt);
  l.hip.rotation.x=THREE.MathUtils.damp(l.hip.rotation.x,moving?Math.sin(phase+l.side*.35)*.055:Math.sin(walkT*1.1)*.008,8,dt);
 });
 arms.forEach(a=>{
  const opposite=Math.sin(phase+Math.PI)*a.side;
