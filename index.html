<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Metal Warriors - Nitro Side Scroll</title>

<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07101b;
    color: white;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
}

#game iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(ellipse at 70% 40%, #194a78, transparent 65%),
        linear-gradient(120deg, #050b14, #10243b);
    padding: 20px;
}

#panel {
    width: min(500px, 95vw);
    padding: 28px;
    text-align: center;
    background: #07182bee;
    border: 1px solid #397bb7;
    border-radius: 16px;
    box-shadow: 0 15px 60px #000a;
}

h1 {
    font-size: clamp(28px, 6vw, 46px);
    letter-spacing: 3px;
    margin: 0;
}

.subtitle {
    color: #79baff;
    letter-spacing: 4px;
    margin-top: 8px;
    font-weight: bold;
}

#panel p {
    color: #bdcfe2;
    line-height: 1.5;
    font-size: 13px;
}

button {
    border: 1px solid #69a9ed;
    background: #102d4d;
    color: white;
    border-radius: 10px;
    padding: 13px 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    background: #286ca9;
}

#panel button {
    width: 100%;
    margin-top: 12px;
}

#hud {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
}

#top {
    position: absolute;
    top: 12px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    text-shadow: 0 2px 6px black;
}

#brand {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
}

#brand small {
    display: block;
    font-size: 10px;
    color: #83baff;
    margin-top: 4px;
}

#status {
    font-size: 12px;
    text-align: right;
}

#movement {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 14px;
    display: flex;
    gap: 9px;
    pointer-events: auto;
}

#actions {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    right: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
    max-width: 55%;
    pointer-events: auto;
}

.control {
    min-width: 58px;
    min-height: 52px;
    font-size: 12px;
}

#rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #07101b;
    color: white;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: bold;
}

@media (orientation: portrait) {
    #rotate {
        display: flex;
    }
}

@media (max-width: 700px) {
    #movement {
        left: 7px;
        bottom: 15px;
        gap: 5px;
    }

    #actions {
        right: 7px;
        bottom: 15px;
        gap: 5px;
        max-width: 63%;
    }

    .control {
        padding: 10px;
        min-width: 48px;
        min-height: 48px;
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="menu">
    <div id="panel">
        <h1>METAL WARRIORS</h1>
        <div class="subtitle">NITRO SIDE SCROLL</div>

        <p>
            Protótipo de treinamento com o Nitro geométrico
            original, movimentação lateral e combate.
        </p>

        <button id="start">INICIAR TREINO</button>
        <button id="editor">EDITOR DE MAPAS</button>

        <p>
            Utilize o celular na horizontal.
        </p>
    </div>
</div>

<div id="hud">

    <div id="top">
        <div id="brand">
            METAL WARRIORS
            <small>ARENA DE TREINAMENTO</small>
        </div>

        <div id="status">
            NITRO V6<br>
            HP 100%
        </div>
    </div>

    <div id="movement">
        <button class="control" id="left">◀</button>
        <button class="control" id="right">▶</button>
    </div>

    <div id="actions">
        <button class="control" id="jump">SALTO</button>
        <button class="control" id="jet">JATO</button>
        <button class="control" id="fire">DISPARAR</button>
        <button class="control" id="reset">REINICIAR</button>
        <button class="control" id="back">MENU</button>
    </div>

</div>

<div id="rotate">
    GIRE O CELULAR PARA A PAISAGEM<br><br>
    METAL WARRIORS
</div>

<script>
"use strict";

/* =========================================
   CARREGAMENTO DO NITRO ORIGINAL
========================================= */

const NITRO_URL =
"https://raw.githubusercontent.com/triplewprefabs-glitch/Echoes-of-Steel/main/metal_warriors_nitro_geometrico_v6_animacoes_especiais.html";

const game = document.getElementById("game");

const frame = document.createElement("iframe");
frame.title = "Arena Nitro";
frame.allow = "fullscreen";

game.appendChild(frame);

let loaded = false;
let active = false;

function getNitro() {
    try {
        return frame.contentWindow.__mwNitro || null;
    } catch (e) {
        return null;
    }
}

/* =========================================
   ADAPTAÇÃO DO CÓDIGO ORIGINAL
========================================= */

function adaptNitro(source) {

    source = source.replace(
        "<title>Metal Warriors — Nitro geométrico</title>",
        "<title>Metal Warriors — Nitro Side Scroll</title>"
    );

    // Remove os controles antigos de demonstração.
    source = source.replace(
        "#controls{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:9px;pointer-events:auto}",
        "#controls{display:none!important}"
    );

    source = source.replace(
        "#help{position:absolute;right:16px;top:16px;text-align:right;font-size:12px;color:#d2e2f8;text-shadow:0 2px 6px #000}",
        "#help{display:none!important}"
    );

    // Projéteis passam a avançar para a direita.
    source = source.replace(
        "new THREE.Vector3(-.22,.015,0)",
        "new THREE.Vector3(.22,.015,0)"
    );

    source = source.replace(
        "g.position.set(-1.9,3.9,.45)",
        "g.position.set(1.9,3.9,.45)"
    );

    const gameplay = `

    /* =====================================
       METAL WARRIORS - SIDE SCROLL
    ===================================== */

    const moveState = {
        left: false,
        right: false
    };

    let lastMovementTime = performance.now();

    const sidePlatforms = [];

    function createPlatform(x, y, width, height, depth) {

        const material = new THREE.MeshStandardMaterial({
            color: 0x34495b,
            metalness: 0.65,
            roughness: 0.48
        });

        const platform = new THREE.Mesh(
            new THREE.BoxGeometry(width, height, depth),
            material
        );

        platform.position.set(x, y, 0);
        platform.castShadow = true;
        platform.receiveShadow = true;

        scene.add(platform);
        sidePlatforms.push(platform);

        const stripe = new THREE.Mesh(
            new THREE.BoxGeometry(width * .96, .035, depth + .02),
            new THREE.MeshStandardMaterial({
                color: 0x718da5,
                metalness: .6,
                roughness: .35
            })
        );

        stripe.position.set(
            x,
            y + height / 2 + .02,
            0
        );

        scene.add(stripe);

        return platform;
    }

    /* =====================================
       PERCURSO LATERAL
    ===================================== */

    createPlatform(0, -.20, 18, .28, 3.6);
    createPlatform(16, -.20, 18, .28, 3.6);
    createPlatform(32, -.20, 18, .28, 3.6);
    createPlatform(48, -.20, 18, .28, 3.6);
    createPlatform(64, -.20, 18, .28, 3.6);

    // Plataformas elevadas.

    createPlatform(7, 1.15, 4, .22, 2.8);
    createPlatform(18, 2.0, 4.5, .22, 2.8);
    createPlatform(29, 1.2, 5, .22, 2.8);
    createPlatform(41, 2.1, 4.5, .22, 2.8);
    createPlatform(54, 1.3, 5, .22, 2.8);

    // Estruturas industriais.

    for (let i = 0; i < 16; i++) {

        const x = 5 + i * 4.5;
        const h = 1.2 + (i % 3) * .5;

        const obstacle = new THREE.Mesh(
            new THREE.BoxGeometry(.75, h, .85),
            new THREE.MeshStandardMaterial({
                color: i % 2 ? 0x46596a : 0x263b50,
                metalness: .65,
                roughness: .5
            })
        );

        obstacle.position.set(x, h / 2, -.15);
        obstacle.castShadow = true;
        obstacle.receiveShadow = true;

        scene.add(obstacle);
    }

    /* =====================================
       MOVIMENTAÇÃO LATERAL
    ===================================== */

    const originalY = mech.position.y;

    function sideScrollUpdate() {

        if (!active) return;

        const now = performance.now();

        const dt = Math.min(
            (now - lastMovementTime) / 1000,
            .04
        );

        lastMovementTime = now;

        let direction = 0;

        if (moveState.left) direction -= 1;
        if (moveState.right) direction += 1;

        if (!fallen && !victory) {

            if (direction !== 0) {

                const speed = 4.2;

                mech.position.x += direction * speed * dt;

                walking = true;
                running = false;

            } else {

                walking = false;
                running = false;
            }
        }

        // Limites do percurso.

        mech.position.x = Math.max(
            -7,
            Math.min(72, mech.position.x)
        );

        // Câmera acompanha o robô lateralmente.

        const cameraTargetX = mech.position.x + 2.8;

        camera.position.x +=
            (cameraTargetX - camera.position.x) *
            Math.min(1, dt * 4);

        camera.position.y +=
            (5.1 - camera.position.y) *
            Math.min(1, dt * 2);

        camera.position.z +=
            (15.5 - camera.position.z) *
            Math.min(1, dt * 2);

        camera.lookAt(
            mech.position.x + 1,
            2.65,
            0
        );

        requestAnimationFrame(sideScrollUpdate);
    }

    /* =====================================
       INTERFACE DE CONTROLE
    ===================================== */

    window.__mwNitro = {

        mech: mech,
        camera: camera,
        scene: scene,
        moveState: moveState,

        start: function() {
            lastMovementTime = performance.now();
            sideScrollUpdate();
        },

        jump: function() {
            if (!jumpActive && !fallen) {
                jumpActive = true;
                jumpT = 0;
            }
        },

        fireOn: function() {
            firing = true;
        },

        fireOff: function() {
            firing = false;
        },

        jetToggle: function() {
            jetting = !jetting;
        },

        reset: function() {

            standUp();

            mech.position.set(0, 0, 0);

            camera.position.set(2.8, 5.1, 15.5);
            camera.lookAt(1, 2.65, 0);

            walking = false;
            running = false;
            firing = false;
            jetting = false;
            jumpActive = false;

            jumpT = 0;
            hitT = 0;
            landT = 0;

            setCombatMode(false);
        }
    };

    `;

    source = source.replace(
        "animate();",
        gameplay + "\\nanimate();"
    );

    return source;
}

/* =========================================
   BUSCA DO ARQUIVO ORIGINAL
========================================= */

fetch(NITRO_URL)
.then(response => {

    if (!response.ok) {
        throw new Error("Não foi possível carregar o Nitro v6.");
    }

    return response.text();

})
.then(source => {

    frame.srcdoc = adaptNitro(source);

    frame.onload = () => {
        loaded = true;
    };

})
.catch(error => {

    document.getElementById("panel").innerHTML = `
        <h1>ERRO</h1>
        <p>Não foi possível carregar o Nitro original.</p>
        <p>Verifique sua conexão com a internet.</p>
        <button onclick="location.reload()">TENTAR NOVAMENTE</button>
    `;

});

/* =========================================
   INICIAR TREINO
========================================= */

document.getElementById("start").onclick = () => {

    const nitro = getNitro();

    if (!loaded || !nitro) {
        alert("Aguarde o carregamento do Nitro v6.");
        return;
    }

    active = true;

    document.getElementById("menu").style.display = "none";
    document.getElementById("hud").style.display = "block";

    nitro.start();
};

/* =========================================
   CONTROLES DE MOVIMENTO
========================================= */

function holdButton(id, actionOn, actionOff) {

    const button = document.getElementById(id);

    button.addEventListener("pointerdown", e => {

        e.preventDefault();

        button.classList.add("active");

        actionOn();

    });

    function release(e) {

        e.preventDefault();

        button.classList.remove("active");

        actionOff();
    }

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("pointerleave", release);
}

holdButton(
    "left",
    () => {
        const n = getNitro();
        if (n) n.moveState.left = true;
    },
    () => {
        const n = getNitro();
        if (n) n.moveState.left = false;
    }
);

holdButton(
    "right",
    () => {
        const n = getNitro();
        if (n) n.moveState.right = true;
    },
    () => {
        const n = getNitro();
        if (n) n.moveState.right = false;
    }
);

holdButton(
    "fire",
    () => {
        const n = getNitro();
        if (n) n.fireOn();
    },
    () => {
        const n = getNitro();
        if (n) n.fireOff();
    }
);

/* =========================================
   AÇÕES
========================================= */

document.getElementById("jump").onclick = () => {

    const n = getNitro();
    if (n) n.jump();
};

document.getElementById("jet").onclick = () => {

    const n = getNitro();
    if (n) n.jetToggle();
};

document.getElementById("reset").onclick = () => {

    const n = getNitro();
    if (n) n.reset();
};

document.getElementById("back").onclick = () => {

    active = false;

    document.getElementById("hud").style.display = "none";
    document.getElementById("menu").style.display = "flex";
};

document.getElementById("editor").onclick = () => {

    alert(
        "O editor 3D será integrado em uma próxima etapa."
    );
};

/* =========================================
   TECLADO - COMPUTADOR
========================================= */

window.addEventListener("keydown", e => {

    const n = getNitro();
    if (!n) return;

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        n.moveState.left = true;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        n.moveState.right = true;
    }

    if (e.code === "Space") {
        e.preventDefault();
        n.jump();
    }

    if (e.key.toLowerCase() === "j") {
        n.fireOn();
    }

    if (e.key.toLowerCase() === "k") {
        n.jetToggle();
    }
});

window.addEventListener("keyup", e => {

    const n = getNitro();
    if (!n) return;

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        n.moveState.left = false;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        n.moveState.right = false;
    }

    if (e.key.toLowerCase() === "j") {
        n.fireOff();
    }
});

/* =========================================
   BLOQUEIO DE ZOOM
========================================= */

// Impede gestos de pinça e zoom durante o jogo.

document.addEventListener("gesturestart", e => {
    e.preventDefault();
});

document.addEventListener("gesturechange", e => {
    e.preventDefault();
});

document.addEventListener("gestureend", e => {
    e.preventDefault();
});

document.addEventListener("touchmove", e => {
    if (active) e.preventDefault();
}, { passive: false });

document.addEventListener("wheel", e => {
    if (active && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
    }
}, { passive: false });

</script>
</body>
</html>
