<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Metal Warriors - Nitro Side Scroll</title>

<style>
* {
    box-sized: caixa com borda;
    -webkit-user-select: nenhum;
    seleção do usuário: nenhuma;
    interação por toque: nenhuma;
}

html, corpo {
    margem: 0;
    largura: 100%;
    altura: 100%;
    overflow: oculto;
    fundo: #07101b;
    cor: branca;
    família de fontes: Arial, sem serifa;
}

#jogo {
    posição: fixa;
    inserção: 0;
}

#jogo iframe {
    largura: 100%;
    altura: 100%;
    borda: 0;
}

#menu {
    posição: fixa;
    inserção: 0;
    Índice z: 10;
    Exibir: flexível;
    alinhamento-itens: centro;
    justificar-conteúdo: centralizado;
    fundo:
        gradiente radial (elipse a 70% 40%, #194a78, transparente 65%),
        gradiente-linear(120 graus, #050b14, #10243b);
    preenchimento: 20px;
}

#painel {
    largura: min(500px, 95vw);
    preenchimento: 28px;
    alinhamento do texto: centralizado;
    fundo: #07182bee;
    borda: 1px sólida #397bb7;
    raio da borda: 16px;
    box-shadow: 0 15px 60px #000a;
}

h1 {
    tamanho da fonte: clamp(28px, 6vw, 46px);
    espaçamento entre letras: 3px;
    margem: 0;
}

.subtítulo {
    cor: #79baff;
    espaçamento entre letras: 4px;
    margem superior: 8px;
    peso da fonte: negrito;
}

#painel p {
    cor: #bdcfe2;
    altura da linha: 1,5;
    tamanho da fonte: 13px;
}

botão {
    borda: 1px sólida #69a9ed;
    fundo: #102d4d;
    cor: branca;
    raio da borda: 10px;
    preenchimento: 13px 16px;
    peso da fonte: negrito;
    cursor: ponteiro;
}

botão:ativo {
    fundo: #286ca9;
}

#botão do painel {
    largura: 100%;
    margem superior: 12px;
}

#hud {
    exibir: nenhum;
    posição: fixa;
    inserção: 0;
    Índice z: 5;
    eventos-ponteiro: nenhum;
}

#principal {
    posição: absoluta;
    topo: 12px;
    esquerda: 15px;
    direita: 15px;
    Exibir: flexível;
    justify-content: espaço-entre;
    sombra-do-texto: 0 2px 6px preto;
}

#marca {
    tamanho da fonte: 15px;
    peso da fonte: 900;
    espaçamento entre letras: 2px;
}

#marca pequena {
    exibir: bloco;
    tamanho da fonte: 10px;
    cor: #83baff;
    margem superior: 4px;
}

#status {
    tamanho da fonte: 12px;
    alinhamento de texto: à direita;
}

#movimento {
    posição: absoluta;
    inferior: max(18px, env(safe-area-inset-bottom));
    esquerda: 14px;
    Exibir: flexível;
    espaçamento: 9px;
    eventos-ponteiro: automático;
}

#ações {
    posição: absoluta;
    inferior: max(18px, env(safe-area-inset-bottom));
    direita: 14px;
    Exibir: flexível;
    flex-wrap: envolver;
    justify-content: flex-end;
    espaço: 8px;
    largura máxima: 55%;
    eventos-ponteiro: automático;
}

.control {
    largura mínima: 58px;
    altura mínima: 52px;
    tamanho da fonte: 12px;
}

#rotacionar {
    exibir: nenhum;
    posição: fixa;
    inserção: 0;
    Índice z: 30;
    fundo: #07101b;
    cor: branca;
    alinhamento-itens: centro;
    justificar-conteúdo: centralizado;
    alinhamento do texto: centralizado;
    peso da fonte: negrito;
}

@media (orientação: retrato) {
    #rotacionar {
        Exibir: flexível;
    }
}

@media (max-width: 700px) {
    #movimento {
        esquerda: 7px;
        parte inferior: 15px;
        espaçamento: 5px;
    }

    #ações {
        direita: 7px;
        parte inferior: 15px;
        espaçamento: 5px;
        largura máxima: 63%;
    }

    .control {
        preenchimento: 10px;
        largura mínima: 48px;
        altura mínima: 48px;
        tamanho da fonte: 10px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="menu">
    <div id="panel">
        <h1>GUERREIROS DO METAL</h1>
        <div class="subtitle">NITRO SIDE SCROLL</div>

        <p>
            Protótipo de treinamento com o Nitro geométrico
            original, transferência lateral e combate.
        </p>

        <button id="start">INICIAR TREINO</button>
        <button id="editor">EDITOR DE MAPAS</button>

        <p>
            Utilize o celular na horizontal.
        </p>
    </div>
</div>

<div id="hud">

    <div id="top">
        <div id="brand">
            GUERREIROS DE METAL
            <small>ARENA DE TREINAMENTO</small>
        </div>

        <div id="status">
            NITRO V6<br>
            HP 100%
        </div>
    </div>

    <div id="movimento">
        <button class="control" id="left">◀</button>
        <button class="control" id="right">▶</button>
    </div>

    <div id="actions">
        <button class="control" id="jump">SALTO</button>
        <button class="control" id="jet">JATO</button>
        <button class="control" id="fire">DESPARAR</button>
        <button class="control" id="damage">DANO</button>
        <button class="control" id="destroy">DESTRUIR</button>
        <button class="control" id="reset">REINICIAR</button>
        <button class="control" id="back">MENU</button>
    </div>

</div>

<div id="rotate">
    GIRE O CELULAR PARA A PAISAGEM<br><br>
    GUERREIROS DE METAL
</div>

<script>
"usar estrito";

/* ========================================
   CARREGAMENTO DO NITRO ORIGINAL
========================================= */

const NITRO_URL =
"https://raw.githubusercontent.com/triplewprefabs-glitch/Echoes-of-Steel/main/metal_warriors_nitro_geometrico_v6_animacoes_especiais.html";

const game = document.getElementById("game");

const frame = document.createElement("iframe");
frame.title = "Arena Nitro";
frame.allow = "fullscreen";

jogo.appendChild(frame);

let loaded = false;
let active = false;

função obterNitro() {
    tentar {
        retornar frame.contentWindow.__mwNitro || null;
    } catch (e) {
        retornar nulo;
    }
}

/* ========================================
   ADAPTAÇÃO DO CÓDIGO ORIGINAL
========================================= */

função adaptNitro(fonte) {

    fonte = fonte.substituir(
        "<title>Metal Warriors — Nitro geométrico</title>",
        "<title>Metal Warriors — Nitro Side Scroll</title>"
    );

    // Remove os controles antigos de demonstração.
    fonte = fonte.substituir(
        "#controls{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:9px;pointer-events:auto}",
        "#controls{display:none!important}"
    );

    fonte = fonte.substituir(
        "#help{position:absolute;right:16px;top:16px;text-align:right;font-size:12px;color:#d2e2f8;text-shadow:0 2px 6px #000}",
        "#help{display:none!important}"
    );

    // Os projetos passam a avançar para a direita.
    fonte = fonte.substituir(
        "novo THREE.Vector3(-.22,.015,0)",
        "novo THREE.Vector3(.22,.015,0)"
    );

    fonte = fonte.substituir(
        "g.position.set(-1.9,3.9,.45)",
        "g.position.set(1.9,3.9,.45)"
    );

    // Segunda etapa: placas de blindagem destacáveis, detritos e faíscas.
    const damageSystem = `
const armorParts=[];
const armorDebris=[];
const impactSparks=[];
let damageEvents=0;
const sparkMaterial=new THREE.MeshBasicMaterial({color:0xffc56b});
função registerArmor(parent,points,depth,material,pos){
 const part=plate(parent,points,depth,material,pos);
 const record={mesh:part,parent,position:part.position.clone(),quaternion:part.quaternion.clone(),scale:part.scale.clone(),detached:false};
 armorParts.push(registro);
 parte de retorno;
}
registrarArmadura(torso,[[-.78,.48],[-.58,.79],[-.18,.82],[-.37,.22],[-.72,.14]],.09,borda,[0,0,.55]);
registrarArmadura(torso,[[.78,.48],[.58,.79],[.18,.82],[.37,.22],[.72,.14]],.09,borda,[0,0,.55]);
braços.paraCada(a=>{
 const s=a.side;
 registerArmor(a.shoulder,s<0?[[-.22,.12],[-.56,.27],[-.68,.08],[-.54,-.2]]:[[.22,.12],[.56,.27],[.68,.08],[.54,-.2]],.10,blue,[0,0,.43]);
 registrarArmadura(a.fore,[[-.18,-.04],[-.23,-.38],[-.08,-.57],[.18,-.52],[.23,-.22]],.09,edge,[0,0,.27]);
});
pernas.paraCada(l=>{
 registerArmor(l.thigh,[[-.22,-.12],[-.25,-.48],[-.12,-.72],[.12,-.72],[.25,-.48],[.22,-.12]],.09,edge,[0,0,.31]);
 registerArmor(l.shin,[[-.19,-.08],[-.23,-.45],[-.12,-.69],[.12,-.69],[.23,-.45],[.19,-.08]],.09,blue2,[0,0,.31]);
});
função detachArmor(registro, índice){
 se(registro.desanexado)retorne;
 record.mesh.updateWorldMatrix(true,false);
 cena.anexar(registro.malha);
 registro.desanexado=verdadeiro;
 const direction=index%2===0?-1:1;
 armorDebris.push({mesh:record.mesh,velocity:new THREE.Vector3(direction*(1.2+(index%3)*.35),2.0+(index%2)*.65,(index%3-1)*1.1),spin:new THREE.Vector3(.8+index*.13,1.1+index*.09,.7),life:5});
}
function detachAllArmor(){armorParts.forEach((part,i)=>detachArmor(part,i));}
função aplicarDanoDeArmadura(){
 eventosDeDano++;
 const target=Math.min(armorParts.length,damageEvents);
 for(let i=0;i<target;i++){if(!armorParts[i].detached){detachArmor(armorParts[i],i);break;}}
}
função spawnImpactSparks(){
 for(let i=0;i<9;i++){
  const spark=mesh(new THREE.SphereGeometry(.035,6,5),sparkMaterial,[0,0,0],scene);
  spark.position.set((Math.random()-.5)*.9,2.5+Math.random()*2.0,.5);
  impactSparks.push({mesh:spark,velocity:new THREE.Vector3((Math.random()-.5)*3,Math.random()*3,(Math.random()-.5)*2),life:.35+Math.random()*.3});
 }
}
função atualizarEfeitosDeDano(dt){
 for(let i=armorDebris.length-1;i>=0;i--){
  const d=armorDebris[i];d.velocity.y-=7.5*dt;d.mesh.position.addScaledVector(d.velocity,dt);
  d.malha.rotação.x+=d.giro.x*dt;d.malha.rotação.y+=d.giro.y*dt;d.malha.rotação.z+=d.giro.z*dt;d.vida-=dt;
  if(d.mesh.position.y<.12){d.mesh.position.y=.12;d.velocity.y=Math.abs(d.velocity.y)*.22;d.velocity.x*=.72;d.velocity.z*=.72;}
  if(d.life<=0){scene.remove(d.mesh);armorDebris.splice(i,1);}
 }
 for(let i=impactSparks.length-1;i>=0;i--){
  const p=impactSparks[i];p.mesh.position.addScaledVector(p.velocity,dt);p.velocity.y-=5*dt;p.life-=dt;
  p.mesh.scale.setScalar(Math.max(.01,p.life*2.5));
  if(p.life<=0){scene.remove(p.mesh);impactSparks.splice(i,1);}
 }
}
função resetDamageSystem(){
 para(const parte de armorParts){
  if(part.detached){part.parent.add(part.mesh);part.mesh.position.copy(part.position);part.mesh.quaternion.copy(part.quaternion);part.mesh.scale.copy(part.scale);part.detached=false;}
 }
 armorDebris.length=0;impactSparks.length=0;damageEvents=0;damageLevel=0;resetMechanicalFailures();
}

const failedJoints=[];
const faultMarkers=[];
const thrusterHealth=[1,1];
seja mechanicalHitCount=0;
const faultMaterial=new THREE.MeshBasicMaterial({color:0xff321f});
const jointTargets=[
 ...legs.map((l,i)=>({kind:"leg",joint:l.knee,limb:l,side:l.side,index:i})),
 ...arms.map((a,i)=>({kind:"arm",joint:a.elbow,limb:a,side:a.side,index:i}))
];
função aplicarDanosDoSistema(){
 ContagemdeAcertosMecânicos++;
 const targetIndex=mechanicalHitCount-1;
 se (targetIndex < jointTargets.length) {
  const target=jointTargets[targetIndex];
  if(!failedJoints.some(x=>x.target===target)){
   const marker=mesh(new THREE.SphereGeometry(.075,8,6),faultMaterial,[0,0,.27],target.joint);
   faultMarkers.push(marcador);
   failedJoints.push({target,marker});
  }
 }outro{
  const tIndex=(targetIndex-jointTargets.length)%2;
  thrusterHealth[tIndex]=0;
  if(thrusterHealth[0]===0&&thrusterHealth[1]===0)jetting=false;
 }
}
função atualizarFalhasMecânicas(dt){
 failedJoints.forEach(({target})=>{
  se (target.kind == "leg"){
   target.limb.shin.rotation.z=THREE.MathUtils.damp(target.limb.shin.rotation.z,target.side*.72,4,dt);
   target.limb.foot.rotation.z=THREE.MathUtils.damp(target.limb.foot.rotation.z,-target.side*.34,4,dt);
   target.limb.thigh.rotation.z=THREE.MathUtils.damp(target.limb.thigh.rotation.z,target.side*.12,4,dt);
  }outro{
   target.limb.fore.rotation.z=THREE.MathUtils.damp(target.limb.fore.rotation.z,-target.side*.68,4,dt);
   target.limb.upper.rotation.z=THREE.MathUtils.damp(target.limb.upper.rotation.z,target.side*.22,4,dt);
  }
 });
 propulsores.paraCada((pod,i)=>{
  se(thrusterHealth[i]===0){
   pod.rotation.z=THREE.MathUtils.damp(pod.rotation.z,Math.sin(performance.now()*.018+i)*.16,5,dt);
   pod.children.forEach(o=>{if(o.material===glow)o.scale.setScalar(.08);});
  }
 });
 if(failedJoints.some(x=>x.target.kind==="leg"&&x.target.limb.side<0) &&
    failedJoints.some(x=>x.target.kind==="leg"&&x.target.limb.side>0)){
  caminhando=falso;correndo=falso;
 }
 if(failedJoints.some(x=>x.target.kind==="arm"))firing=false;
}
função resetMechanicalFailures(){
 failedJoints.length=0;
 faultMarkers.forEach(m=>m.parent&&m.parent.remove(m));
 faultMarkers.length=0;
 thrusterHealth[0]=1;thrusterHealth[1]=1;mechanicalHitCount=0;
 propulsores.paraCada(p=>p.filhos.paraCada(o=>{if(o.material===brilho)o.escala.definirEscalador(1);}));
}
função destruirSistemasMecânicos(){
 jointTargets.forEach(target=>{
  if(!failedJoints.some(x=>x.target===target)){
   const marker=mesh(new THREE.SphereGeometry(.075,8,6),faultMaterial,[0,0,.27],target.joint);
   faultMarkers.push(marker);failedJoints.push({target,marker});
  }
 });
 thrusterHealth[0]=0;thrusterHealth[1]=0;jetting=false;walking=false;running=false;firing=false;
}
    `;
    fonte = fonte.substituir(
        "function triggerHit(){damageLevel=Math.min(1,damageLevel+.28);if(fallen)return;",
        "function triggerHit(){damageLevel=Math.min(1,damageLevel+.28);if(fallen)return;applyArmorDamage();applySystemDamage();spawnImpactSparks();"
    );
    fonte = fonte.substituir(
        "renderer.render(cena, câmera);",
        "updateDamageEffects(dt);\n updateMechanicalFailures(dt);\n renderer.render(scene,camera);"
    );
    fonte = fonte.substituir(
        "reset: função() {",
        "dano: função(){triggerHit();},\n destruir: função(){damageLevel=1;detachAllArmor();startFall();},\n resetar: função() {\n resetDamageSystem();"
    );

    const gameplay = `

    /* =====================================
       GUERREIROS DE METAL - PÁGINA LATERAL
    ===================================== */

    const moveState = {
        esquerda: falso,
        direita: falso
    };

    deixe lastMovementTime = performance.now();

    const sidePlatforms = [];

    função criarPlataforma(x, y, largura, altura, profundidade) {

        const material = new THREE.MeshStandardMaterial({
            cor: 0x34495b,
            metalicidade: 0,65,
            rugosidade: 0,48
        });

        const platform = new THREE.Mesh(
            novo THREE.BoxGeometry(largura, altura, profundidade),
            material
        );

        platform.position.set(x, y, 0);
        platform.castShadow = true;
        platform.receiveShadow = true;

        cena.adicionar(plataforma);
        sidePlatforms.push(plataforma);

        const listra = novo TRÊS.Malha(
            novo THREE.BoxGeometry(largura * 0,96, 0,035, profundidade + 0,02),
            novo TRÊS.MaterialPadrãoDeMalha({
                cor: 0x718da5,
                metalicidade: 0,6,
                rugosidade: 0,35
            })
        );

        listra.posição.definir(
            x,
            y + altura / 2 + 0,02,
            0
        );

        cena.adicionar(faixa);

        retornar plataforma;
    }

    /* =====================================
       PERCURSO LATERAL
    ===================================== */

    criarPlataforma(0, -.20, 18, .28, 3.6);
    criarPlataforma(16, -.20, 18, .28, 3.6);
    criarPlataforma(32, -.20, 18, .28, 3.6);
    criarPlataforma(48, -.20, 18, .28, 3.6);
    criarPlataforma(64, -.20, 18, .28, 3.6);

    // Plataformas elevadas.

    criarPlataforma(7, 1.15, 4, .22, 2.8);
    criarPlataforma(18, 2.0, 4.5, .22, 2.8);
    criarPlataforma(29, 1.2, 5, .22, 2.8);
    criarPlataforma(41, 2.1, 4.5, .22, 2.8);
    criarPlataforma(54, 1.3, 5, .22, 2.8);

    // Estruturas Industriais.

    para (seja i = 0; i < 16; i++) {

        const x = 5 + i * 4,5;
        const h = 1.2 + (i % 3) * .5;

        const obstacle = new THREE.Mesh(
            novo THREE.BoxGeometry(.75, h, .85),
            novo TRÊS.MaterialPadrãoDeMalha({
                cor: i % 2 ? 0x46596a : 0x263b50,
                metalicidade: 0,65
                rugosidade: 0,5
            })
        );

        obstáculo.posição.definir(x, h / 2, -.15);
        obstáculo.castShadow = true;
        obstáculo.receberSombra = verdadeiro;

        cena.adicionar(obstáculo);
    }

    /* =====================================
       MOVIMENTAÇÃO LATERAL
    ===================================== */

    const originalY = mech.posição.y;

    função sideScrollUpdate() {

        se (!ativo) retornar;

        const now = performance.now();

        const dt = Math.min(
            (agora - últimoMovimento) / 1000,
            0,04
        );

        últimoMovimentoTime = agora;

        seja a direção = 0;

        se (movimentoEstado.esquerda) direção -= 1;
        se (moveState.right) direção += 1;

        se (!caído && !vitória) {

            se (direção !== 0) {

                velocidade constante = 4,2;

                posição.mec.x += direção * velocidade * dt;

                Caminhar = verdadeiro;
                correndo = falso;

            } outro {

                Caminhar = falso;
                correndo = falso;
            }
        }

        // Limites do percurso.

        posição.mec.x = Math.max(
            -7,
            Math.min(72, mech.position.x)
        );

        // Câmera acompanha o robô lateralmente.

        const cameraTargetX = mech.position.x + 2.8;

        posição.x da câmera +=
            (cameraTargetX - camera.position.x) *
            Math.min(1, dt * 4);

        posição da câmera.y +=
            (5.1 - posição da câmera.y) *
            Math.min(1, dt * 2);

        posição.z da câmera +=
            (15.5 - posição.da.câmera.z) *
            Math.min(1, dt * 2);

        câmera.olharPara(
            posição.mecânica.x + 1,
            2,65,
            0
        );

        solicitarQuadroDeAnimação(atualizaçãoDeRolagemLateral);
    }

    /* =====================================
       INTERFACE DE CONTROLE
    ===================================== */

    janela.__mwNitro = {

        mecânico: mecânico,
        câmera: câmera,
        cena: cena,
        moveState: moveState,

        iniciar: função() {
            lastMovementTime = performance.now();
            sideScrollUpdate();
        },

        pular: função() {
            se (!puloAtivo && !caído) {
                jumpActive = verdadeiro;
                saltoT = 0;
            }
        },

        fireOn: função() {
            disparo = verdadeiro;
        },

        fireOff: função() {
            disparo = falso;
        },

        jetToggle: função() {
            jato = !jato;
        },

        dano: função() { acionarAcerto(); },
        destruir: função() { nívelDeDano = 1; desanexarTodaArmadura(); destruirSistemasMecânicos(); iniciarQueda(); },
        reset: função() {
            resetDamageSystem();

            ficar de pé();

            posição.mecânica.definir(0, 0, 0);

            câmera.posição.definir(2.8, 5.1, 15.5);
            câmera.lookAt(1, 2.65, 0);

            Caminhar = falso;
            correndo = falso;
            disparo = falso;
            jato = falso;
            jumpActive = falso;

            saltoT = 0;
            hitT = 0;
            landT = 0;

            definirModoCombate(falso);
        }
    };

    `;

    fonte = fonte.substituir(
        "animar();",
        danoSystem + "\n" + jogabilidade + "\nanimate();"
    );

    retornar fonte;
}

/* ========================================
   BUSCA DO ARQUIVO ORIGINAL
========================================= */

buscar(NITRO_URL)
.então(resposta => {

    se (!response.ok) {
        throw new Error("Não foi possível carregar o Nitro v6.");
    }

    retornar resposta.texto();

})
.then(source => {

    frame.srcdoc = adaptNitro(source);

    frame.onload = () => {
        carregado = verdadeiro;
    };

})
.catch(erro => {

    document.getElementById("painel").innerHTML = `
        <h1>ERRO</h1>
        <p>Não foi possível carregar o Nitro original.</p>

/* ========================================
   INICIAR TREINO
========================================= */

document.getElementById("start").onclick = () => {

    const nitro = getNitro();

    se (!carregado || !nitro) {
        alert("Aguarde o carregamento do Nitro v6.");
        retornar;
    }

    ativo = verdadeiro;

    document.getElementById("menu").style.display = "none";
    document.getElementById("hud").style.display = "block";

    nitro.iniciar();
};

/* ========================================
   CONTROLES DE MOVIMENTO
========================================= */

função holdButton(id, actionOn, actionOff) {

    const button = document.getElementById(id);

    botão.adicionarOuvinteDeEvento("pointerdown", e => {

        e.preventDefault();

        botão.classList.adicionar("ativo");

        açãoEm();

    });

    função liberar(e) {

        e.preventDefault();

        botão.classList.remove("ativo");

        açãoDesligada();
    }

    botão.adicionarOuvinteDeEvento("ponteiroparacima", liberar);
    botão.adicionarOuvinteDeEvento("ponteirocancel", liberar);
    botão.adicionarOuvinteDeEvento("pontadorleave", liberar);
}

botão de segurar(

);

/* ========================================
   TECLADO - COMPUTADOR
========================================= */

janela.adicionarOuvinteDeEvento("keydown", e => {

    const n = getNitro();
    se (!n) retornar;

    se (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        n.moveState.left = true;
    }

    se (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        n.moveState.right = true;
    }

    se (e.code === "Espaço") {
        e.preventDefault();
        n.pular();
    }

    se (e.key.toLowerCase() === "j") {
        n.fireOn();
    }

    se (e.key.toLowerCase() === "k") {
        n.jetToggle();
    }
});

janela.adicionarOuvinteDeEvento("keyup", e => {

    const n = getNitro();
    se (!n) retornar;

    se (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        n.moveState.left = false;
    }

    se (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        n.moveState.right = false;
    }

    se (e.key.toLowerCase() === "j") {
        n.fireOff();
    }
});

/* ========================================
   BLOQUEIO DE ZOOM
========================================= */

// Impede gestos de pinça e zoom durante o jogo.

document.addEventListener("gesturestart", e => {
    e.preventDefault();
});

document.addEventListener("gesturechange", e => {
    e.preventDefault();
});

document.addEventListener("gestureend", e => {
    e.preventDefault();
});

document.addEventListener("touchmove", e => {
    se (ativo) e.preventDefault();
}, { passivo: falso });

document.addEventListener("wheel", e => {
    se (ativo && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
    }
}, { passivo: falso });
